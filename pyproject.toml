[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linux-session-snapshot"
version = "0.1.0"
description = "Cooperative Linux desktop session manager"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "psutil>=5.9",
    "python-xlib>=0.33",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8.0"]

[project.scripts]
sessionctl = "session_snapshot.cli.main:main"
sessiongui = "session_snapshot.gui.entry:main"

[tool.hatch.build.targets.wheel]
packages = ["src/session_snapshot"]

[tool.pytest.ini_options]
testpaths = ["tests"]